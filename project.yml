name: LanPrint

options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  groupSortPosition: top
  # 锁定 Xcode 15.4 的工程格式；CI 必须使用 scripts/install-xcodegen.sh 安装的 2.38.0
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  LanPrint:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: LanPrint
        excludes:
          - "Resources/Info.plist"
    info:
      path: LanPrint/Resources/Info.plist
      properties:
        CFBundleDisplayName: 局域网打印
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: 局域网打印需要访问局域网，以发现并连接你网络中的打印机。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _ipp._tcp
          - _printer._tcp
          - _pdl-datastream._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.lanprint.ios
        PRODUCT_NAME: LanPrint
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: 局域网打印

schemes:
  LanPrint:
    build:
      targets:
        LanPrint: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
